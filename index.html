<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security Audit Engine v7.1</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --accent: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.3rem;
            color: var(--accent);
            margin: 0 0 5px 0;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #1f2937;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: #090d16;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .console {
            display: none;
            background-color: #000;
            color: #22c55e;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 10px;
            border-radius: 6px;
            white-space: pre-line;
            margin-top: 10px;
            border: 1px solid #1e293b;
        }

        .report-section {
            display: none;
        }

        .section-title {
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 1px solid #374151;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .finding-item {
            padding: 10px;
            border-radius: 6px;
            background-color: #1f2937;
            margin-bottom: 10px;
            border-left: 4px solid #fff;
        }

        .finding-item.danger { border-color: var(--danger); }
        .finding-item.warning { border-color: var(--warning); }
        .finding-item.success { border-color: var(--success); }

        .finding-header {
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .finding-desc {
            font-size: 0.75rem;
            color: #d1d5db;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Instant Audit Engine v7.1</h1>
        <p>Pemindaian Konfigurasi Keamanan Web Berbasis Seluler</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label for="targetUrl">URL Target Website Audit (Wajib Menggunakan https://)</label>
            <!-- Diubah ke HTTPS secara default untuk mencegah restriksi Mixed Content peramban handphone -->
            <input type="url" id="targetUrl" value="https://testfire.net" placeholder="https://situs-target.com">
        </div>
        <button onclick="executeInstantScan()">Mulai Audit Nyata</button>
        <div id="consoleLog" class="console"></div>
    </div>

    <div id="reportCard" class="card report-section">
        <div class="section-title">📊 Hasil Audit Kepatuhan & Kelemahan</div>
        <div id="findingsList"></div>
    </div>
</div>

<script>
    async function executeInstantScan() {
        const targetUrl = document.getElementById('targetUrl').value.trim();
        const consoleLog = document.getElementById('consoleLog');
        const reportCard = document.getElementById('reportCard');
        const findingsList = document.getElementById('findingsList');

        if (!targetUrl) {
            alert('Wajib mengisi URL Target!');
            return;
        }

        consoleLog.style.display = 'block';
        reportCard.style.display = 'none';
        findingsList.innerHTML = '';
        consoleLog.innerText = `[*] Mengaktifkan soket jaringan peramban mobile...\n`;

        // Mengubah target secara otomatis ke https jika user salah memasukkan format http biasa
        let safeTarget = targetUrl;
        if (safeTarget.startsWith('http://')) {
            safeTarget = safeTarget.replace('http://', 'https://');
        }

        // PERBAIKAN UTAMA: Format pemanggilan API Jembatan AllOrigins yang valid dengan parameter ?url=
        const cleanTarget = encodeURIComponent(safeTarget.replace(/\/$/, ""));
        const integratedEngine = `https://allorigins.win{cleanTarget}`; 
        
        consoleLog.innerText += `[*] Mengirimkan paket analitik ke target via Integrated Gateway...\n`;

        try {
            const response = await fetch(integratedEngine);
            if (!response.ok) {
                throw new Error(`Gateway memberikan respon status: ${response.status}`);
            }
            
            const data = await response.json();

            if (!data || !data.contents) {
                throw new Error("Target memblokir koneksi otomatis luar jaringan.");
            }

            consoleLog.innerText += `[+] Transaksi data berhasil diselesaikan secara riil!\n`;
            consoleLog.innerText += `[*] Memetakan parameter keamanan arsitektur sistem...\n`;

            const pageContent = data.contents.toLowerCase();
            
            // Evaluasi logika terhadap keberadaan string pengaman bawaan aplikasi
            let checks = [
                {
                    name: 'Strict-Transport-Security (HSTS)',
                    exist: pageContent.includes('strict-transport-security'),
                    severity: 'danger',
                    desc: 'Parameter HSTS absen di server. Komunikasi tidak dipaksa menggunakan jalur HTTPS aman secara konsisten, rentan terhadap pembajakan jalur komunikasi (MitM).'
                },
                {
                    name: 'Content-Security-Policy (CSP)',
                    exist: pageContent.includes('content-security-policy') || pageContent.includes('http-equiv="content-security-policy"'),
                    severity: 'warning',
                    desc: 'Kebijakan CSP tidak dikonfigurasi. Browser tidak membatasi asal eksekusi skrip, meningkatkan risiko eksploitasi Cross-Site Scripting (XSS).'
                },
                {
                    name: 'X-Content-Type-Options',
                    exist: pageContent.includes('x-content-type-options'),
                    severity: 'warning',
                    desc: 'Header X-Content-Type-Options tidak ditemukan. Server membiarkan browser melakukan MIME-sniffing terhadap jenis file data.'
                }
            ];

            // Render hasil temuan secara dinamis
            checks.forEach(item => {
                const element = document.createElement('div');
                element.className = `finding-item ${item.exist ? 'success' : item.severity}`;
                
                if (item.exist) {
                    element.innerHTML = `
                        <div class="finding-header">
                            <span>✓ ${item.name}</span>
                            <span style="color:var(--success)">AKTIF</span>
                        </div>
                        <div class="finding-desc">Komponen perlindungan ini terdeteksi aktif pada konfigurasi sistem target.</div>
                    `;
                } else {
                    element.innerHTML = `
                        <div class="finding-header">
                            <span>⚠️ ${item.name} (CWE-523)</span>
                            <span style="color:${item.severity === 'danger' ? 'var(--danger)' : 'var(--warning)'}">${item.severity.toUpperCase()}</span>
                        </div>
                        <div class="finding-desc">${item.desc}</div>
                    `;
                }
                findingsList.appendChild(element);
            });

            consoleLog.innerText += `[+] Dokumen analisis komponen yang kurang berhasil disusun.`;
            reportCard.style.display = 'block';

        } catch (error) {
            consoleLog.style.color = '#ef4444';
            consoleLog.innerText += `\n[-] Kegagalan audit jaringan.\nDetail: ${error.message}\nTip: Pastikan koneksi internet ponsel stabil dan situs target dapat diakses publik.`;
        }
    }
</script>

</body>
</html>
