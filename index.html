<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security Audit Engine v6.0</title>
    <style>
        :root { --bg: #090d16; --card: #111827; --accent: #06b6d4; --text: #f3f4f6; --muted: #9ca3af; --danger: #ef4444; --warning: #f59e0b; --success: #10b981; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.3rem; color: var(--accent); margin: 0; }
        .card { background-color: var(--card); border-radius: 10px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #374151; background-color: #1f2937; color: white; font-size: 0.95rem; box-sizing: border-box; }
        button { width: 100%; background-color: var(--accent); color: #090d16; font-weight: bold; padding: 12px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; margin-top: 10px; }
        .console { display: none; background: #000; color: #22c55e; font-family: monospace; font-size: 0.75rem; padding: 10px; border-radius: 6px; white-space: pre-line; margin-top: 10px; }
        .report-section { display: none; }
        .section-title { font-size: 1rem; font-weight: bold; border-bottom: 1px solid #374151; padding-bottom: 5px; margin-bottom: 10px; }
        .finding-item { padding: 10px; border-radius: 6px; background-color: #1f2937; margin-bottom: 10px; border-left: 4px solid #fff; }
        .finding-item.danger { border-color: var(--danger); }
        .finding-item.warning { border-color: var(--warning); }
        .finding-item.success { border-color: var(--success); }
        .finding-header { font-size: 0.85rem; font-weight: bold; display: flex; justify-content: space-between; }
        .finding-desc { font-size: 0.75rem; color: #d1d5db; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Enterprise Mobile Audit Engine v6.0</h1>
        <p>Arsitektur Serverless Cloud-Driven Engine</p>
    </header>

    <div class="card">
        <div class="form-group" style="margin-bottom: 10px;">
            <label style="font-size:0.8rem; color:var(--muted)">1. Masukkan URL Cloudflare Worker Engine Anda</label>
            <input type="url" id="workerUrl" placeholder="https://workers.dev">
        </div>
        <div class="form-group">
            <label style="font-size:0.8rem; color:var(--muted)">2. URL Target Website Audit</label>
            <input type="url" id="targetUrl" value="http://testfire.net">
        </div>
        <button onclick="executeCloudScan()">Eksekusi Pengujian Tingkat Tinggi</button>
        <div id="consoleLog" class="console"></div>
    </div>

    <div id="reportCard" class="card report-section">
        <div class="section-title">📊 Laporan Kepatuhan Infrastruktur Nyata</div>
        <div style="font-size: 0.8rem; margin-bottom: 10px; color: var(--muted)">Teknologi Server Target: <span id="serverInfo" style="color:white; font-weight:bold;"></span></div>
        <div id="findingsList"></div>
    </div>
</div>

<script>
    async function executeCloudScan() {
        const workerUrl = document.getElementById('workerUrl').value.trim();
        const targetUrl = document.getElementById('targetUrl').value.trim();
        const consoleLog = document.getElementById('consoleLog');
        const reportCard = document.getElementById('reportCard');
        const findingsList = document.getElementById('findingsList');
        const serverInfo = document.getElementById('serverInfo');

        if (!workerUrl || !targetUrl) {
            alert('Wajib mengisi URL Worker Engine dan URL Target!');
            return;
        }

        consoleLog.style.display = 'block';
        reportCard.style.display = 'none';
        findingsList.innerHTML = '';
        consoleLog.innerText = `[*] Menginisialisasi jabat tangan handshake ke Serverless Cloud Engine...\n`;

        try {
            // Memerintahkan Cloudflare Worker untuk melakukan audit mendalam dari luar jaringan handphone
            consoleLog.innerText += `[*] Mengirimkan instruksi pemindaian asinkron tingkat tinggi ke Cloudflare...\n`;
            
            const response = await fetch(workerUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ target: targetUrl })
            });
            
            const data = await response.json();

            if (data.error) {
                throw new Error(data.error);
            }

            consoleLog.innerText += `[+] Respon dari Cloudflare Engine Berhasil Diterima!\n`;
            consoleLog.innerText += `[*] Menyusun pemetaan kepatuhan audit standar OWASP...\n`;

            serverInfo.innerText = data.server_info;

            // Render hasil audit nyata
            if (data.findings.length === 0 && data.missing_components.length === 0) {
                findingsList.innerHTML = `<div class="finding-item success"><div class="finding-header">✓ Sistem Aman</div><div class="finding-desc">Seluruh parameter keamanan dasar terkonfigurasi dengan baik.</div></div>`;
            }

            data.findings.forEach(item => {
                findingsList.innerHTML += `
                    <div class="finding-item ${item.severity}">
                        <div class="finding-header">
                            <span>⚠️ ${item.title}</span>
                            <span style="color:var(--${item.severity})">${item.severity.toUpperCase()}</span>
                        </div>
                        <div class="finding-desc">${item.desc}</div>
                    </div>
                `;
            });

            data.missing_components.forEach(item => {
                findingsList.innerHTML += `
                    <div class="finding-item warning">
                        <div class="finding-header">
                            <span>⚠️ Komponen Hilang: ${item.component}</span>
                            <span style="color:var(--warning)">MEDIUM</span>
                        </div>
                        <div class="finding-desc">Dampak: ${item.impact}</div>
                    </div>
                `;
            });

            consoleLog.innerText += `[+] Proses peninjauan selesai secara industri.`;
            reportCard.style.display = 'block';

        } catch (error) {
            consoleLog.style.color = '#ef4444';
            consoleLog.innerText += `\n[-] Kegagalan Eksekusi Komputasi Awan.\nDetail: ${error.message}\nPastikan URL Cloudflare Worker sudah benar dan berstatus Active.`;
        }
    }
</script>

</body>
</html>
