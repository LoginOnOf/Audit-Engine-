<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security Audit Engine v8.0</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --accent: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.3rem;
            color: var(--accent);
            margin: 0 0 5px 0;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #1f2937;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: #090d16;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .console {
            display: none;
            background-color: #000;
            color: #22c55e;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 10px;
            border-radius: 6px;
            white-space: pre-wrap;
            margin-top: 10px;
            border: 1px solid #1e293b;
            word-break: break-all;
        }

        .report-section {
            display: none;
        }

        .section-title {
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 1px solid #374151;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .finding-item {
            padding: 10px;
            border-radius: 6px;
            background-color: #1f2937;
            margin-bottom: 10px;
            border-left: 4px solid #fff;
        }

        .finding-item.danger { border-color: var(--danger); }
        .finding-item.warning { border-color: var(--warning); }
        .finding-item.success { border-color: var(--success); }

        .finding-header {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .finding-desc {
            font-size: 0.75rem;
            color: #d1d5db;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Instant Audit Engine v8.0</h1>
        <p>Solusi Anti-Gagal: Integrasi API Keamanan Global</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label style="display:block; font-size:0.8rem; margin-bottom:4px; color:var(--text-muted)">Domain Target Audit (Masukkan domain saja, contoh: google.com)</label>
            <input type="text" id="targetUrl" value="google.com" placeholder="situs-target.com">
        </div>
        <button onclick="executeAntiGagalScan()">Mulai Audit Nyata</button>
        <div id="consoleLog" class="console"></div>
    </div>

    <div id="reportCard" class="card report-section">
        <div class="section-title">📊 Analisis Komponen Pertahanan & HTTP Headers</div>
        <div id="findingsList"></div>
    </div>
</div>

<script>
    async function executeAntiGagalScan() {
        const targetUrl = document.getElementById('targetUrl').value.trim();
        const consoleLog = document.getElementById('consoleLog');
        const reportCard = document.getElementById('reportCard');
        const findingsList = document.getElementById('findingsList');

        if (!targetUrl) {
            alert('Wajib mengisi domain target!');
            return;
        }

        // Bersihkan input dari http:// atau https:// jika user terlanjur memasukkannya
        let cleanDomain = targetUrl.replace('https://', '').replace('http://', '').replace(/\/$/, "");

        consoleLog.style.display = 'block';
        reportCard.style.display = 'none';
        consoleLog.style.color = '#22c55e';
        consoleLog.innerText = `[*] Mengaktifkan modul audit seluler...\n`;
        consoleLog.innerText += `[*] Menghubungi Server Audit Global untuk memproses ${cleanDomain}...\n`;

        // Menggunakan API HackerTarget resmi yang aman dari blokir CORS peramban HP
        const apiUrl = `https://hackertarget.com{cleanDomain}`;

        try {
            const response = await fetch(apiUrl);
            const textData = await response.text();

            // Jika API mengembalikan eror dari server mereka
            if (textData.includes("error") || textData.trim() === "") {
                throw new Error("Gagal mengambil data. Pastikan domain aktif dan dieja dengan benar.");
            }

            consoleLog.innerText += `[+] Transaksi data jaringan selesai secara riil!\n`;
            consoleLog.innerText += `[*] Memetakan poin keamanan yang kurang...\n`;

            const lowerCaseData = textData.toLowerCase();

            // Analisis komponen pertahanan yang ada atau kurang
            let checks = [
                {
                    name: 'Strict-Transport-Security (HSTS)',
                    exist: lowerCaseData.includes('strict-transport-security'),
                    severity: 'danger',
                    desc: 'Parameter HSTS tidak ditemukan pada server. Situs web tidak memaksa penggunaan HTTPS aman, membuat lalu lintas data rentan dibajak di jaringan (MitM).'
                },
                {
                    name: 'Content-Security-Policy (CSP)',
                    exist: lowerCaseData.includes('content-security-policy'),
                    severity: 'warning',
                    desc: 'Kebijakan CSP absen. Server tidak membatasi asal muasal eksekusi skrip, meningkatkan risiko eksploitasi celah Cross-Site Scripting (XSS).'
                },
                {
                    name: 'X-Content-Type-Options',
                    exist: lowerCaseData.includes('x-content-type-options'),
                    severity: 'warning',
                    desc: 'Header X-Content-Type-Options tidak aktif. Membiarkan browser menebak tipe file, mempermudah eksekusi malware yang disamarkan.'
                }
            ];

            // Tampilkan hasil pemetaan ke dasbor HP
            findingsList.innerHTML = "";
            checks.forEach(item => {
                const element = document.createElement('div');
                element.className = `finding-item ${item.exist ? 'success' : item.severity}`;
                
                if (item.exist) {
                    element.innerHTML = `
                        <div class="finding-header">
                            <span>✓ ${item.name}</span>
                            <span style="color:var(--success); float:right;">AKTIF / AMAN</span>
                        </div>
                        <div class="finding-desc">Komponen pelindung ini terpasang dengan baik pada sistem target.</div>
                    `;
                } else {
                    element.innerHTML = `
                        <div class="finding-header">
                            <span>⚠️ ${item.name} (CWE-523)</span>
                            <span style="color:var(--${item.severity}); float:right;">${item.severity.toUpperCase()}</span>
                        </div>
                        <div class="finding-desc">${item.desc}</div>
                    `;
                }
                findingsList.appendChild(element);
            });

            // Tampilkan juga data mentah HTTP Header asli dari server untuk bahan laporan
            const rawHeaderElement = document.createElement('div');
            rawHeaderElement.innerHTML = `
                <div class="section-title" style="margin-top:20px;">📄 Data Mentah HTTP Headers Target</div>
                <pre style="background:#000; color:#22c55e; padding:10px; border-radius:6px; font-size:0.75rem; overflow-x:auto;">${textData}</pre>
            `;
            findingsList.appendChild(rawHeaderElement);

            consoleLog.innerText += `[+] Laporan validasi komponen selesai disusun.`;
            reportCard.style.display = 'block';

        } catch (error) {
            consoleLog.style.color = '#ef4444';
            consoleLog.innerText += `\n[-] Kegagalan Pemindaian.\nDetail Kendala: ${error.message}`;
        }
    }
</script>

</body>
</html>
